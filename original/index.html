<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Castle Remembers</title>
<style>
  :root { --bg: #000000; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; } }
  :root[data-theme="dark"] { --bg: #000000; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; image-rendering: pixelated; background: #0b0910; }
</style>
</head>
<body>
<canvas id="game" width="720" height="1280"></canvas>
<script>
// THE CASTLE REMEMBERS — shared constants
(function (CR) {
  'use strict';
  const C = {
    W: 720, H: 1280,
    VIEW_H: 1000,          // game viewport height (top of canvas)
    CTRL_H: 280,           // touch control panel height (bottom of canvas)
    FLOORS: 5,
    FLOOR_GAP: 320,
    WORLD_H: 1580,
    WALL_L: 24, WALL_R: 696,

    GRAVITY: 1900, JUMP_V: 640,
    MOVE_SPEED: 230, CLIMB_SPEED: 170,
    PLAYER_W: 26, PLAYER_H: 44,

    GUARD_W: 30, GUARD_H: 46, GUARD_SPEED: 70,
    DOOR_W: 14, DOOR_H: 130,
    INTERACT_R: 46,
    SHOVE_R: 58,

    STORAGE_KEY: 'castle-remembers-v1',
    FORGET: { x: 210, y: 1150, w: 300, h: 70 },
    DEBUG_BTN: { x: 634, y: 60, w: 74, h: 30 },

    // Reconstruction transition timeline (seconds)
    REBUILD: { reconAt: 1.7, assembleAt: 2.4, total: 3.7, skipAfter: 0.8 }
  };
  C.floorY = i => C.WORLD_H - 40 - i * C.FLOOR_GAP; // floor surface y (feet level)
  CR.C = C;
})(window.CR = window.CR || {});


// js/sounds.js — procedural audio for THE CASTLE REMEMBERS.
// Everything is synthesized with the Web Audio API at runtime: no audio files, nothing to load.
//
//   CR.Sound.play('lever');            // one-shot effect (see SFX table below)
//   CR.Sound.play('step', { rate: 1.1 });
//   CR.Sound.ambient(true);            // wind + torch crackle bed
//   CR.Sound.music.start({ intensity: 0.4, seed: 3 });   // procedural D-Phrygian loop
//   CR.Sound.music.setIntensity(0.8);  // more drum / more notes (e.g. by tier pressure)
//   CR.Sound.music.stop();
//   CR.Sound.toggle();                 // mute / unmute (persisted in localStorage)
//   CR.Sound.loadMusic('music/theme.ogg') // optional: use a real track instead of the generator
//
// Browsers only allow audio after a user gesture; this module unlocks itself on the first
// pointer/touch/key event, so calling play() early is harmless (it just stays silent).
(function (CR) {
  'use strict';

  const STORE_KEY = 'castle-remembers-sound';

  let ctx = null, master = null, sfxBus = null, musBus = null, ambBus = null;
  let noiseBuf = null;
  let enabled = true;
  try { enabled = localStorage.getItem(STORE_KEY) !== '0'; } catch (e) { /* private mode */ }
  let volume = 0.8;
  let unlocked = false;
  const lastAt = Object.create(null);   // per-effect throttle
  let wantAmbient = false, wantMusic = null;

  // ---------------------------------------------------------------- context
  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { return null; }
    master = ctx.createGain();
    master.gain.value = enabled ? volume : 0;
    master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1.0;  sfxBus.connect(master);
    musBus = ctx.createGain(); musBus.gain.value = 0.55; musBus.connect(master);
    ambBus = ctx.createGain(); ambBus.gain.value = 0.7;  ambBus.connect(master);
    // one shared 2 s white-noise buffer, reused by every noise-based effect
    const len = Math.floor(ctx.sampleRate * 2);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') { try { c.resume(); } catch (e) { /* ignore */ } }
    if (!unlocked) {
      unlocked = true;
      // things requested before the first gesture start now
      if (wantAmbient) ambientStart();
      if (wantMusic) music.start(wantMusic);
    }
  }
  ['pointerdown', 'touchstart', 'mousedown', 'keydown'].forEach(ev =>
    window.addEventListener(ev, unlock, { passive: true }));

  // pause everything while the tab is hidden (saves battery, avoids ghost audio)
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { try { ctx.suspend(); } catch (e) { /* ignore */ } }
    else if (unlocked && enabled) { try { ctx.resume(); } catch (e) { /* ignore */ } }
  });

  function now() { return ctx.currentTime; }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  // ---------------------------------------------------------------- primitives
  // gain envelope: attack a → hold s → exponential decay d
  function env(g, t, vol, a, d, s) {
    const p = g.gain;
    p.cancelScheduledValues(t);
    p.setValueAtTime(0.0001, t);
    p.linearRampToValueAtTime(Math.max(0.0002, vol), t + a);
    if (s) p.setValueAtTime(Math.max(0.0002, vol), t + a + s);
    p.exponentialRampToValueAtTime(0.0001, t + a + (s || 0) + d);
  }

  function filterChain(node, o, t, dur) {
    if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass';  f.frequency.setValueAtTime(o.lp, t);
      if (o.lp1) f.frequency.exponentialRampToValueAtTime(o.lp1, t + dur); if (o.q) f.Q.value = o.q; node.connect(f); node = f; }
    if (o.hp) { const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.setValueAtTime(o.hp, t);
      if (o.hp1) f.frequency.exponentialRampToValueAtTime(o.hp1, t + dur); node.connect(f); node = f; }
    if (o.bp) { const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(o.bp, t);
      if (o.bp1) f.frequency.exponentialRampToValueAtTime(o.bp1, t + dur); f.Q.value = o.q || 1.2; node.connect(f); node = f; }
    return node;
  }

  // oscillator voice. o: {type,f0,f1,dur,vol,a,d,s,at,bus,lp,lp1,hp,bp,q,detune,slide}
  function tone(o) {
    const t = now() + (o.at || 0);
    const dur = o.dur || 0.2;
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, o.f0), t);
    if (o.f1 && o.f1 !== o.f0) {
      if (o.slide === 'lin') osc.frequency.linearRampToValueAtTime(Math.max(1, o.f1), t + dur);
      else osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + dur);
    }
    if (o.detune) osc.detune.value = o.detune;
    const a = o.a != null ? o.a : 0.005, d = o.d != null ? o.d : dur, s = o.s || 0;
    const g = ctx.createGain();
    env(g, t, o.vol != null ? o.vol : 0.2, a, d, s);
    const node = filterChain(osc, o, t, dur);
    node.connect(g);
    g.connect(o.bus || sfxBus);
    osc.start(t);
    osc.stop(t + a + s + d + 0.05);
    return osc;
  }

  // noise voice. o: {dur,vol,a,d,s,at,bus,lp,lp1,hp,hp1,bp,bp1,q,rate}
  function noise(o) {
    const t = now() + (o.at || 0);
    const dur = o.dur || 0.1;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    if (o.rate) src.playbackRate.value = o.rate;
    const a = o.a != null ? o.a : 0.003, d = o.d != null ? o.d : dur, s = o.s || 0;
    const g = ctx.createGain();
    env(g, t, o.vol != null ? o.vol : 0.2, a, d, s);
    const node = filterChain(src, o, t, dur);
    node.connect(g);
    g.connect(o.bus || sfxBus);
    src.start(t, Math.random() * 1.5);
    src.stop(t + a + s + d + 0.05);
    return src;
  }

  // ---------------------------------------------------------------- SFX table
  // Each recipe receives (p) = user opts merged with defaults: p.rate scales pitch, p.vol scales volume.
  const SFX = {
    // --- movement
    step(p) {   // boot on stone
      noise({ dur: 0.045, vol: 0.16 * p.vol, lp: 900 * p.rate, lp1: 300, rate: rnd(0.9, 1.1) });
      tone({ type: 'sine', f0: 95 * p.rate, f1: 60, dur: 0.05, vol: 0.10 * p.vol });
    },
    climb(p) {  // wooden rung creak
      tone({ type: 'triangle', f0: 190 * p.rate, f1: 150, dur: 0.07, vol: 0.09 * p.vol, lp: 1400 });
      noise({ dur: 0.04, vol: 0.06 * p.vol, bp: 1200, q: 2 });
    },
    jump(p) {
      tone({ type: 'sine', f0: 200 * p.rate, f1: 420 * p.rate, dur: 0.12, vol: 0.13 * p.vol });
      noise({ dur: 0.05, vol: 0.05 * p.vol, hp: 2000 });
    },
    land(p) {
      noise({ dur: 0.08, vol: 0.22 * p.vol, lp: 500 });
      tone({ type: 'sine', f0: 110 * p.rate, f1: 50, dur: 0.1, vol: 0.2 * p.vol });
    },

    // --- interactables
    lever(p) {  // iron lever: scrape, throw, clack
      noise({ dur: 0.14, vol: 0.10 * p.vol, bp: 1800, bp1: 900, q: 3 });
      tone({ type: 'square', f0: 320 * p.rate, f1: 130, dur: 0.16, vol: 0.06 * p.vol, lp: 1200 });
      tone({ type: 'square', f0: 1400 * p.rate, f1: 900, dur: 0.03, vol: 0.10 * p.vol, at: 0.15 });
      tone({ type: 'sine', f0: 90, f1: 55, dur: 0.12, vol: 0.18 * p.vol, at: 0.15 });
    },
    leverDud(p) { // lever that does nothing: limp clunk
      tone({ type: 'square', f0: 240 * p.rate, f1: 160, dur: 0.08, vol: 0.05 * p.vol, lp: 900 });
      tone({ type: 'sine', f0: 70, f1: 50, dur: 0.1, vol: 0.14 * p.vol, at: 0.07 });
    },
    leverTrap(p) { // lever + spring release
      SFX.lever(p);
      tone({ type: 'sawtooth', f0: 900 * p.rate, f1: 180, dur: 0.28, vol: 0.14 * p.vol, at: 0.18, lp: 3000 });
      noise({ dur: 0.22, vol: 0.14 * p.vol, hp: 2500, at: 0.18 });
    },
    door(p) {   // oak door creaks open, settles
      tone({ type: 'sawtooth', f0: 85 * p.rate, f1: 140 * p.rate, dur: 0.45, vol: 0.07 * p.vol, lp: 700, a: 0.03 });
      noise({ dur: 0.4, vol: 0.05 * p.vol, bp: 600, bp1: 1400, q: 4, a: 0.02 });
      tone({ type: 'sine', f0: 75, f1: 45, dur: 0.14, vol: 0.16 * p.vol, at: 0.42 });
    },
    doorLocked(p) { // bricked / barred: dull thud
      noise({ dur: 0.09, vol: 0.18 * p.vol, lp: 420 });
      tone({ type: 'sine', f0: 85 * p.rate, f1: 45, dur: 0.16, vol: 0.28 * p.vol });
      tone({ type: 'triangle', f0: 170 * p.rate, f1: 120, dur: 0.06, vol: 0.06 * p.vol });
    },
    chest(p) {  // lid creak then a soft glint
      tone({ type: 'sawtooth', f0: 160 * p.rate, f1: 240 * p.rate, dur: 0.18, vol: 0.05 * p.vol, lp: 900 });
      noise({ dur: 0.1, vol: 0.05 * p.vol, bp: 900, q: 3 });
      [659, 880, 1319].forEach((f, i) =>
        tone({ type: 'sine', f0: f * p.rate, dur: 0.22, vol: 0.10 * p.vol, at: 0.16 + i * 0.07 }));
    },
    shard(p) {  // memory shard: crystalline sparkle
      [1568, 1976, 2637, 3136].forEach((f, i) =>
        tone({ type: 'sine', f0: f * p.rate, f1: f * p.rate * 1.01, dur: 0.28, vol: 0.09 * p.vol, at: i * 0.045 }));
      tone({ type: 'triangle', f0: 784 * p.rate, dur: 0.35, vol: 0.05 * p.vol, at: 0.05 });
    },
    trapWarn(p) { // the 0.55 s tell before a chest erupts: three ticks
      [0, 0.16, 0.32].forEach(at =>
        tone({ type: 'square', f0: 1800 * p.rate, f1: 1500, dur: 0.025, vol: 0.09 * p.vol, at, lp: 4000 }));
      noise({ dur: 0.45, vol: 0.04 * p.vol, bp: 3000, q: 6, a: 0.1 });
    },
    spikes(p) { // spike eruption / spikes shooting up
      noise({ dur: 0.18, vol: 0.28 * p.vol, hp: 2200, hp1: 900 });
      tone({ type: 'sawtooth', f0: 420 * p.rate, f1: 90, dur: 0.2, vol: 0.14 * p.vol, lp: 2500 });
      tone({ type: 'sine', f0: 2400 * p.rate, f1: 2300, dur: 0.3, vol: 0.05 * p.vol, at: 0.02 });
    },
    spikesDown(p) { // retracting spikes slide back
      noise({ dur: 0.14, vol: 0.10 * p.vol, bp: 1500, bp1: 500, q: 2 });
      tone({ type: 'triangle', f0: 380 * p.rate, f1: 180, dur: 0.14, vol: 0.05 * p.vol });
    },
    gateOpen(p) { // portcullis: chain rattle + rumble
      for (let i = 0; i < 7; i++) noise({ dur: 0.02, vol: 0.09 * p.vol, hp: 2200, at: i * 0.055 + rnd(0, 0.012) });
      noise({ dur: 0.5, vol: 0.10 * p.vol, lp: 220, a: 0.05 });
      tone({ type: 'sine', f0: 60, f1: 48, dur: 0.5, vol: 0.10 * p.vol });
    },
    gateClose(p) { // iron slams down
      noise({ dur: 0.16, vol: 0.30 * p.vol, lp: 320 });
      tone({ type: 'sine', f0: 70 * p.rate, f1: 40, dur: 0.24, vol: 0.30 * p.vol });
      tone({ type: 'triangle', f0: 880 * p.rate, f1: 860, dur: 0.45, vol: 0.05 * p.vol, at: 0.01 });
      tone({ type: 'triangle', f0: 1320 * p.rate, f1: 1290, dur: 0.35, vol: 0.03 * p.vol, at: 0.01 });
    },
    alarm(p) {  // alarm bell (T3 lever): two strikes
      [0, 0.45].forEach(at => {
        tone({ type: 'sine', f0: 880 * p.rate, f1: 870, dur: 0.8, vol: 0.13 * p.vol, at });
        tone({ type: 'sine', f0: 1320 * p.rate, f1: 1305, dur: 0.6, vol: 0.07 * p.vol, at });
        tone({ type: 'sine', f0: 2010 * p.rate, f1: 1990, dur: 0.4, vol: 0.04 * p.vol, at });
        noise({ dur: 0.02, vol: 0.10 * p.vol, hp: 3000, at });
      });
    },

    // --- combat & danger
    hit(p) {    // player takes a blow
      noise({ dur: 0.12, vol: 0.32 * p.vol, lp: 700 });
      tone({ type: 'sine', f0: 160 * p.rate, f1: 40, dur: 0.26, vol: 0.32 * p.vol });
      tone({ type: 'square', f0: 900 * p.rate, f1: 300, dur: 0.05, vol: 0.06 * p.vol, lp: 2000 });
    },
    death(p) {  // one hit ends the run: blow + long fall
      SFX.hit(p);
      tone({ type: 'sawtooth', f0: 300 * p.rate, f1: 55, dur: 0.7, vol: 0.12 * p.vol, at: 0.08, lp: 900 });
      tone({ type: 'sine', f0: 55, f1: 30, dur: 0.9, vol: 0.22 * p.vol, at: 0.1 });
      noise({ dur: 0.6, vol: 0.08 * p.vol, lp: 300, at: 0.1, a: 0.05 });
    },
    shove(p) {  // player shoves a guard: whoosh + armored thud
      noise({ dur: 0.14, vol: 0.14 * p.vol, bp: 900, bp1: 250, q: 1.5 });
      noise({ dur: 0.1, vol: 0.18 * p.vol, lp: 600, at: 0.09 });
      tone({ type: 'sine', f0: 120 * p.rate, f1: 45, dur: 0.18, vol: 0.24 * p.vol, at: 0.09 });
      tone({ type: 'triangle', f0: 700 * p.rate, f1: 500, dur: 0.12, vol: 0.05 * p.vol, at: 0.1 });
    },
    shoveArmor(p) { // heavy: metal clang, he doesn't go down yet
      SFX.shove(p);
      tone({ type: 'square', f0: 1100 * p.rate, f1: 1050, dur: 0.3, vol: 0.06 * p.vol, at: 0.1, lp: 3000 });
      tone({ type: 'square', f0: 1650 * p.rate, f1: 1600, dur: 0.2, vol: 0.03 * p.vol, at: 0.1, lp: 3500 });
    },
    guardAlert(p) { // a guard notices you: short horn
      tone({ type: 'square', f0: 392 * p.rate, dur: 0.14, vol: 0.06 * p.vol, lp: 1500, a: 0.01 });
      tone({ type: 'square', f0: 523 * p.rate, dur: 0.22, vol: 0.06 * p.vol, lp: 1500, at: 0.14, a: 0.01 });
      noise({ dur: 0.3, vol: 0.02 * p.vol, bp: 1000, q: 2, a: 0.02 });
    },
    arrow(p) {  // bowstring twang + shaft whoosh
      tone({ type: 'triangle', f0: 240 * p.rate, f1: 160, dur: 0.06, vol: 0.14 * p.vol });
      noise({ dur: 0.28, vol: 0.14 * p.vol, hp: 1400, hp1: 3500, a: 0.01 });
    },
    arrowHitWall(p) {
      noise({ dur: 0.05, vol: 0.14 * p.vol, hp: 1500 });
      tone({ type: 'triangle', f0: 600 * p.rate, f1: 300, dur: 0.07, vol: 0.08 * p.vol });
    },

    // --- shard-heart (the one-use second chance)
    heartGain(p) { // shard becomes a heart: two thumps + shimmer
      tone({ type: 'sine', f0: 70, f1: 50, dur: 0.12, vol: 0.26 * p.vol });
      tone({ type: 'sine', f0: 70, f1: 50, dur: 0.14, vol: 0.20 * p.vol, at: 0.17 });
      [1047, 1319, 1568].forEach((f, i) =>
        tone({ type: 'sine', f0: f * p.rate, dur: 0.4, vol: 0.05 * p.vol, at: 0.3 + i * 0.06 }));
    },
    heartSave(p) { // the shard-heart shatters and absorbs the hit
      noise({ dur: 0.28, vol: 0.28 * p.vol, hp: 2800, hp1: 6000 });
      [2637, 2093, 1568, 1175].forEach((f, i) =>
        tone({ type: 'sine', f0: f * p.rate, f1: f * p.rate * 0.97, dur: 0.3, vol: 0.09 * p.vol, at: i * 0.05 }));
      tone({ type: 'sine', f0: 60, f1: 40, dur: 0.3, vol: 0.2 * p.vol });
      tone({ type: 'triangle', f0: 523 * p.rate, dur: 0.6, vol: 0.05 * p.vol, at: 0.2 });
    },
    heartbeat(p) { // low-key pulse while a shard-heart is active
      tone({ type: 'sine', f0: 62, f1: 48, dur: 0.1, vol: 0.14 * p.vol });
      tone({ type: 'sine', f0: 62, f1: 48, dur: 0.12, vol: 0.10 * p.vol, at: 0.16 });
    },

    // --- flow / UI
    uiConfirm(p) {
      tone({ type: 'sine', f0: 660 * p.rate, dur: 0.06, vol: 0.10 * p.vol });
      tone({ type: 'sine', f0: 990 * p.rate, dur: 0.1, vol: 0.10 * p.vol, at: 0.06 });
    },
    uiMove(p) { tone({ type: 'sine', f0: 440 * p.rate, dur: 0.035, vol: 0.06 * p.vol }); },
    runStart(p) { // drum + rising horn
      tone({ type: 'sine', f0: 110, f1: 45, dur: 0.3, vol: 0.28 * p.vol });
      noise({ dur: 0.08, vol: 0.10 * p.vol, lp: 900 });
      tone({ type: 'square', f0: 294 * p.rate, f1: 587 * p.rate, dur: 0.5, vol: 0.05 * p.vol, at: 0.05, lp: 1800, a: 0.05 });
    },
    floorUp(p) { // reached a new floor: two rising bells
      tone({ type: 'sine', f0: 523 * p.rate, dur: 0.25, vol: 0.07 * p.vol });
      tone({ type: 'sine', f0: 784 * p.rate, dur: 0.35, vol: 0.07 * p.vol, at: 0.12 });
    },
    escape(p) { // through the great arch: fanfare in D Dorian
      const seq = [293.66, 349.23, 440.00, 587.33];
      seq.forEach((f, i) => {
        tone({ type: 'triangle', f0: f * p.rate, dur: 0.45, vol: 0.12 * p.vol, at: i * 0.16, lp: 2500 });
        tone({ type: 'sine', f0: f * p.rate / 2, dur: 0.45, vol: 0.06 * p.vol, at: i * 0.16 });
      });
      [293.66, 440.00, 587.33, 880.00].forEach(f =>
        tone({ type: 'triangle', f0: f * p.rate, dur: 1.8, vol: 0.05 * p.vol, at: 0.66, a: 0.05, lp: 2200 }));
      noise({ dur: 1.6, vol: 0.05 * p.vol, lp: 900, lp1: 200, a: 0.3, at: 0.6 }); // wind on the battlements
    },
    remember(p) { // "THE CASTLE OBSERVED YOU": low dissonant swell
      tone({ type: 'sine', f0: 55, dur: 2.2, vol: 0.20 * p.vol, a: 0.6, d: 1.6 });
      tone({ type: 'triangle', f0: 110, detune: -12, dur: 2.2, vol: 0.06 * p.vol, a: 0.7, d: 1.5, lp: 600 });
      tone({ type: 'triangle', f0: 116.5, detune: 8, dur: 2.0, vol: 0.05 * p.vol, a: 0.9, d: 1.1, lp: 600 }); // minor second rub
      noise({ dur: 2.0, vol: 0.05 * p.vol, lp: 380, lp1: 120, a: 0.8, d: 1.2 });
      tone({ type: 'sine', f0: 1760 * p.rate, f1: 1740, dur: 1.4, vol: 0.025 * p.vol, at: 0.9, a: 0.02 }); // a distant chime
    },
    rebuild(p) { // "RECONSTRUCTING...": stone grinding into place
      noise({ dur: 1.6, vol: 0.22 * p.vol, lp: 140, a: 0.08, d: 1.5 });
      noise({ dur: 1.4, vol: 0.06 * p.vol, bp: 700, bp1: 300, q: 1, a: 0.1, d: 1.3 });
      for (let i = 0; i < 9; i++) { // stone blocks clacking down
        const at = 0.15 + i * rnd(0.11, 0.17);
        noise({ dur: 0.03, vol: 0.12 * p.vol, lp: 1500, at });
        tone({ type: 'sine', f0: rnd(90, 140), f1: 50, dur: 0.1, vol: 0.14 * p.vol, at });
      }
    }
  };
  // minimum spacing between repeats of the same effect (seconds)
  const THROTTLE = { step: 0.09, climb: 0.13, spikes: 0.12, spikesDown: 0.12, arrow: 0.05,
    hit: 0.1, guardAlert: 0.5, heartbeat: 0.5, uiMove: 0.03, shard: 0.05, trapWarn: 0.5 };

  function play(name, opts) {

  // ---------------------------------------------------------------- rasteriser
  const cache = new Map();
  const canDoc = typeof document !== 'undefined' && document.createElement;

  function paint(ctx, rows, ox, oy, flip, scale) {
    const s = scale || PX;
    const w = rows[0].length;
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < row.length; c++) {
        const col = PAL[row[c]];
        if (!col) continue;
        const cc = flip ? (w - 1 - c) : c;
        ctx.fillStyle = col;
        ctx.fillRect(ox + cc * s, oy + r * s, s, s);
      }
    }
  }

  function frameCanvas(name, flip) {
    const key = name + (flip ? '|f' : '');
    let cv = cache.get(key);
    if (cv) return cv;
    const rows = MAPS[name];
    cv = document.createElement('canvas');
    cv.width = rows[0].length * PX;
    cv.height = rows.length * PX;
    paint(cv.getContext('2d'), rows, 0, 0, flip, PX);
    cache.set(key, cv);
    return cv;
  }

  // Draw a sprite with its top-left at (x, y). scale defaults to PX (2).
  function draw(ctx, name, x, y, flip, scale) {
    const rows = MAPS[name];
    if (!rows) return;
    x = Math.round(x); y = Math.round(y);
    if (canDoc && (!scale || scale === PX)) {
      ctx.drawImage(frameCanvas(name, !!flip), x, y);
    } else {
      paint(ctx, rows, x, y, !!flip, scale || PX);
    }
  }

  function size(name) { const r = MAPS[name]; return { w: r[0].length * PX, h: r.length * PX }; }

  CR.Sprites = { PX, PAL, MAPS, draw, size, paint };

      rect(ctx, x - 2, y - 112, 4, h, COL.gate);
      rect(ctx, x - 2, y - 112, 2, h, '#a9aeb9');
      if (!g.open) { rect(ctx, x - 3, y - 6, 6, 6, COL.gateD); }
    }
    rect(ctx, g.x - 28, y - 112 + Math.max(6, h * 0.45), 56, 4, COL.gateD);
    if (!g.open) rect(ctx, g.x - 28, y - 30, 56, 4, COL.gateD);
    if (g.open && g.autoClose) {
      const left = clamp01(1 - g.openT / g.autoClose);
      rect(ctx, g.x - 26, y - 134, 52, 4, '#20232c');
      rect(ctx, g.x - 26, y - 134, 52 * left, 4, left < 0.35 ? COL.danger : COL.gold);
    }
  }

  function drawDoor(ctx, d, t) {
    const y = fy(d.floor);
    if (d.locked) {
      bricks(ctx, d.x - 14, y - C.DOOR_H, 28, C.DOOR_H, 99);
      ctx.strokeStyle = COL.danger; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(d.x - 9, y - 78); ctx.lineTo(d.x + 9, y - 56);
      ctx.moveTo(d.x + 9, y - 78); ctx.lineTo(d.x - 9, y - 56);
      ctx.stroke();
      return;
    }
    if (!d.open) {
      // oak planks with iron bands and a ring
      rect(ctx, d.x - 14, y - C.DOOR_H, 28, C.DOOR_H, P.d);
      for (let x = d.x - 14; x < d.x + 14; x += 8) rect(ctx, x, y - C.DOOR_H, 2, C.DOOR_H, P.D);
      rect(ctx, d.x - 14, y - C.DOOR_H, 28, 2, P.L);
      [y - C.DOOR_H + 22, y - 30].forEach(by => { rect(ctx, d.x - 14, by, 28, 6, P.i); rect(ctx, d.x - 14, by, 28, 2, '#7c8291'); });
      rect(ctx, d.x + 2, y - 66, 6, 6, P.g); rect(ctx, d.x + 4, y - 64, 2, 2, P.d);
      return;
    }
    // open: dark passage, door swung inward on the far side
    rect(ctx, d.x - 14, y - C.DOOR_H, 28, C.DOOR_H, '#0e0b12');
    const sx = d.side === 'L' ? d.x + 14 : d.x - 20;
    rect(ctx, sx, y - C.DOOR_H, 6, C.DOOR_H, P.D);
    rect(ctx, sx + 2, y - C.DOOR_H, 2, C.DOOR_H, P.d);
    if (d.gift) {
      ctx.strokeStyle = `rgba(127,232,255,${0.25 + 0.2 * Math.sin(t * 3)})`;
      ctx.lineWidth = 2;
      ctx.strokeRect(d.x - 16, y - C.DOOR_H - 2, 32, C.DOOR_H + 2);
    }
  }

  function drawLever(ctx, v) {
    const y = fy(v.floor);
    rect(ctx, v.x - 12, y - 10, 24, 10, P.x);
    rect(ctx, v.x - 12, y - 10, 24, 2, P.z);
    rect(ctx, v.x - 2, y - 14, 4, 4, P.i);
    const ang = v.state === 'idle' ? -0.75 : 0.75;
    const ex = v.x + Math.sin(ang) * 26, ey = y - 12 - Math.cos(ang) * 26;
    const sprungTrap = v.state === 'sprung' && v.effect === 'trap';
    ctx.strokeStyle = sprungTrap ? COL.danger : P.i;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(v.x, y - 12); ctx.lineTo(ex, ey); ctx.stroke();
    // A trapped lever's knob is a slightly different shade — a clue for the observant.
    let knob = P.g;
    if (sprungTrap) knob = COL.danger;
    else if (v.state === 'sprung') knob = '#7a7068';
    else if (v.effect === 'trap') knob = '#c98748';
    ctx.fillStyle = knob;
    ctx.fillRect(Math.round(ex) - 5, Math.round(ey) - 5, 10, 10);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(Math.round(ex) - 4, Math.round(ey) - 4, 3, 3);
  }

  function drawChest(ctx, c) {
    const y = fy(c.floor);
    sprite(ctx, c.opened ? 'chest_open' : 'chest_closed', c.x - 12, y - 20);
    if (!c.opened && c.trapped) { rect(ctx, c.x - 2, y - 12, 4, 6, '#d9683f'); } // clasp runs a little red
  }

  function drawSpikes(ctx, s) {
    const y = fy(s.floor), h = s.active ? 14 : 4;
    rect(ctx, s.x, y - 3, s.w, 3, P.i);
    ctx.fillStyle = s.retract ? '#d8c8c8' : '#c9ced8';
    for (let x = s.x; x + 12 <= s.x + s.w + 0.5; x += 12) {
      ctx.beginPath(); ctx.moveTo(x, y - 2); ctx.lineTo(x + 6, y - 2 - h); ctx.lineTo(x + 12, y - 2); ctx.closePath(); ctx.fill();
    }
  }

  function drawEruption(ctx, e, t) {
    const y = fy(e.floor);
    if (e.t < e.warn) {
      rect(ctx, e.x1, y - 6, e.x2 - e.x1, 6, `rgba(255,70,50,${0.35 + 0.3 * Math.sin(t * 40)})`);
    } else {
      ctx.fillStyle = '#e9dede';
      for (let x = e.x1; x + 16 <= e.x2; x += 16) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 8, y - 44); ctx.lineTo(x + 16, y); ctx.closePath(); ctx.fill();
      }
    }
  }

  function drawShard(ctx, sh, t) {
    if (sh.collected) return;
    const y = fy(sh.floor) - 60 + Math.sin(t * 3) * 4;
    ctx.fillStyle = 'rgba(127,232,255,0.16)';
    ctx.beginPath(); ctx.arc(sh.x, y, 18, 0, Math.PI * 2); ctx.fill();
    sprite(ctx, 'shard', sh.x - 7, y - 7);
  }

  function drawExit(ctx, ex, t) {
    const y = fy(ex.floor), x = ex.x;
    const g = ctx.createRadialGradient(x, y - 50, 10, x, y - 50, 120);
    g.addColorStop(0, `rgba(242,166,90,${0.22 + 0.06 * Math.sin(t * 2)})`); g.addColorStop(1, 'rgba(242,166,90,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 130, y - 180, 260, 200);
    sprite(ctx, 'exitarch', x - 40, y - 112, false, 4);   // the great arch onto the battlements
    text(ctx, spaced('ESCAPE'), x, y - 126, 13, COL.gold);
  }

  function drawGuard(ctx, g, t) {
    const y = fy(g.floor), x = g.x;
    const flip = g.dir < 0;
    const stunned = g.stun > 0;
    let frame;
    if (g.type === 'archer') frame = stunned ? 'archer_idle' : (g.shootT < 0.3 ? 'archer_shoot' : 'archer_idle');
    else if (stunned) frame = `${g.type}_stun`;
    else frame = `${g.type}_walk${Math.floor(t * 7 + x * 0.05) % 2 + 1}`;
    sprite(ctx, frame, x - 16, y - 48 + (stunned && g.type === 'archer' ? 6 : 0), flip);
    if (stunned) {
      ctx.fillStyle = '#ffe36a';
      for (let i = 0; i < 3; i++) {
        const a = t * 5 + i * 2.1;
        ctx.fillRect(Math.round(x + Math.cos(a) * 14) - 2, Math.round(y - 56 + Math.sin(a) * 4), 4, 4);
      }
    } else if (g.alert) {
      shadowText(ctx, '!', x, y - 62, 22, COL.danger);
    }
  }

  function drawArrow(ctx, a) {
    sprite(ctx, 'arrow', a.x - 12, fy(a.floor) - 24, a.dir < 0);
  }

  function heroFrame(game) {
    const p = game.player;
    if (p.dead) return game.endT > 0.35 ? 'hero_dead' : 'hero_hurt';
    if (p.climbing) return Math.floor(p.anim * 7) % 2 ? 'hero_climb1' : 'hero_climb2';
    if (!p.onGround) return 'hero_walk1';
    if (p.act > 0) return 'hero_interact';
    if (Math.abs(p.vx) > 1) return ['hero_walk1', 'hero_idle', 'hero_walk2', 'hero_idle'][Math.floor(p.anim * 9) % 4];
    return 'hero_idle';
  }

  function drawPlayer(ctx, game) {
    const p = game.player, frame = heroFrame(game);
    if (frame === 'hero_dead') { sprite(ctx, 'hero_dead', p.x - 24, p.y - 22, p.face < 0); return; }
    sprite(ctx, frame, p.x - 16, p.y - 48, p.face < 0 && !p.climbing);
  }

  function drawPrompt(ctx, pr, t) {
    const y = pr.y + Math.sin(t * 4) * 2;
    rrect(ctx, pr.x - 11, y - 11, 22, 22, 4);
    ctx.fillStyle = '#f4efe2'; ctx.fill();
    ctx.strokeStyle = '#1b1320'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#f4efe2';
    ctx.beginPath(); ctx.moveTo(pr.x - 4, y + 11); ctx.lineTo(pr.x + 4, y + 11); ctx.lineTo(pr.x, y + 16); ctx.closePath(); ctx.fill();
    text(ctx, pr.kind === 'sealed' ? '✕' : 'E', pr.x, y + 1, 16, '#1b1320');
  }

  // assemble: null for a finished castle, else seconds since assembly began (floors slide in one by one)
  function drawWorld(ctx, game, assemble) {
    const L = game.level, cam = Math.round(game.camY), t = game.clock;
    const prog = f => (assemble === null || assemble === undefined ? 1 : clamp01((assemble - f * 0.16) / 0.32));
    const onFloor = (f, fn) => {
      const a = prog(f);
      if (a <= 0) return;
      if (a >= 1) { fn(); return; }
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(0, (1 - a) * 40);
      fn();
      ctx.restore();
    };
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, C.W, C.VIEW_H); ctx.clip();
    const sh = game.shakeOffset ? game.shakeOffset() : { x: 0, y: 0 };
    ctx.translate(sh.x, sh.y - cam);
    if (assemble !== null && assemble !== undefined) {
      rect(ctx, 0, cam, C.W, C.VIEW_H, COL.mortar);
      ctx.save(); ctx.globalAlpha = clamp01(assemble / 0.4); drawBackdrop(ctx, L, cam); ctx.restore();
    } else drawBackdrop(ctx, L, cam);
    for (let i = 0; i < C.FLOORS; i++) onFloor(i, () => [150, 570].forEach((x, k) => drawTorch(ctx, x, fy(i) - 200, t, i * 2 + k)));
    L.gates.forEach(g => onFloor(g.floor, () => drawGate(ctx, g)));
    L.doors.forEach(d => onFloor(d.floor, () => drawDoor(ctx, d, t)));
    L.levers.forEach(v => onFloor(v.floor, () => drawLever(ctx, v)));
    L.chests.forEach(c => onFloor(c.floor, () => drawChest(ctx, c)));
    L.spikes.forEach(s => onFloor(s.floor, () => drawSpikes(ctx, s)));
    (game.eruptions || []).forEach(e => drawEruption(ctx, e, t));
    L.shards.forEach(s => onFloor(s.floor, () => drawShard(ctx, s, t)));
    onFloor(L.exit.floor, () => drawExit(ctx, L.exit, t));
    L.guards.forEach(g => onFloor(g.floor, () => drawGuard(ctx, g, t)));
    (game.arrows || []).forEach(a => drawArrow(ctx, a));
    if (game.player) drawPlayer(ctx, game);
    (game.particles || []).forEach(p => drawParticle(ctx, p));
    if (game.prompt && game.state === 'play') drawPrompt(ctx, game.prompt, t);
    ctx.restore();
    drawVignette(ctx);
  }

  // square pixel particles: shard sparks twinkle and drift up, dust chips fall and fade
  function drawParticle(ctx, p) {
    const a = 1 - p.t / p.life;
    const s = Math.max(1, Math.round(p.s * (p.kind === 'shard' ? 0.55 + 0.45 * Math.abs(Math.sin(p.t * 22)) : 1)));
    ctx.globalAlpha = p.kind === 'shard' ? a : a * 0.9;
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    ctx.globalAlpha = 1;
  }

  // darkens the edges of the viewport so the torches and windows read as the light sources
  let vignette = null;
  function drawVignette(ctx) {
    if (!vignette) {
      vignette = ctx.createRadialGradient(C.W / 2, C.VIEW_H * 0.48, C.W * 0.28, C.W / 2, C.VIEW_H * 0.48, C.W * 0.86);
      vignette.addColorStop(0, 'rgba(6,4,10,0)');
      vignette.addColorStop(0.6, 'rgba(6,4,10,0.22)');
      vignette.addColorStop(1, 'rgba(6,4,10,0.62)');
    }
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, C.W, C.VIEW_H);
  }

  // ---------------------------------------------------------------- overlays
  function stoneBar(ctx, x, y, w, h) {
    rect(ctx, x, y, w, h, 'rgba(44,47,60,0.92)');
    rect(ctx, x, y, w, 2, P.z);
    rect(ctx, x, y + h - 2, w, 2, '#15171e');
  }

  function drawHUD(ctx, game) {
    stoneBar(ctx, 0, 0, C.W, 54);
    const f = CR.floorAt(game.player.y);
    text(ctx, `RUN ${game.runNumber}`, 20, 28, 18, COL.dim, 'left');
    sprite(ctx, 'cross', C.W / 2 - 78, 20);
    text(ctx, `FLOOR ${f + 1}`, C.W / 2 + 6, 28, 24, COL.gold);
    text(ctx, `${game.runTime.toFixed(1)}s  ◆${game.stats.shards}`, C.W - 20, 28, 18, COL.dim, 'right');
    if (game.hintMsg) {
      const a = Math.min(1, (2.2 - game.hintMsg.t) / 0.5);
      rect(ctx, 40, 928, C.W - 80, 44, `rgba(8,6,12,${0.65 * a})`);
      text(ctx, game.hintMsg.text, C.W / 2, 950, 18, `rgba(239,228,200,${a})`, 'center', 'normal');
    }
  }

  function drawWhisper(ctx, game, y) {
    const w = game.whisper;
    if (!w) return;
    const a = Math.max(0, Math.min(1, w.t / 0.6, (w.dur - w.t) / 0.8));
    shadowText(ctx, spaced(w.title), C.W / 2, y, 18, `rgba(${COL.whisper},${0.85 * a})`);
    if (w.sub) shadowText(ctx, w.sub, C.W / 2, y + 30, 20, `rgba(${COL.whisper},${0.65 * a})`, 'center', 'italic');
  }

  function drawArrowIcon(ctx, cx, cy, dir, color) {
    const s = 20;
    ctx.fillStyle = color;
    ctx.beginPath();
    if (dir === 'left') { ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s * 0.7, cy - s); ctx.lineTo(cx + s * 0.7, cy + s); }
    if (dir === 'right') { ctx.moveTo(cx + s, cy); ctx.lineTo(cx - s * 0.7, cy - s); ctx.lineTo(cx - s * 0.7, cy + s); }
    if (dir === 'up') { ctx.moveTo(cx, cy - s); ctx.lineTo(cx - s, cy + s * 0.7); ctx.lineTo(cx + s, cy + s * 0.7); }
    if (dir === 'down') { ctx.moveTo(cx, cy + s); ctx.lineTo(cx - s, cy - s * 0.7); ctx.lineTo(cx + s, cy - s * 0.7); }
    ctx.closePath(); ctx.fill();
  }

  function drawControls(ctx, input, dim) {
    rect(ctx, 0, C.VIEW_H, C.W, C.CTRL_H, '#151320');
    rect(ctx, 0, C.VIEW_H, C.W, 3, '#2c2f3c');
    const held = (input && input.held) || {};
    ctx.save();
    if (dim) ctx.globalAlpha = 0.35;
    CR.BUTTONS.forEach(b => {
      const on = !!held[b.id];
      rrect(ctx, b.x, b.y, b.w, b.h, b.label ? b.w / 2 : 16);
      ctx.fillStyle = on ? '#4a3d5c' : '#252132';
      ctx.fill();
      ctx.strokeStyle = on ? '#c9b98a' : '#4d4560';
      ctx.lineWidth = 3;
      ctx.stroke();
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      if (b.id === 'act') {
        text(ctx, 'ACT', cx, cy - 8, 26, on ? '#ffffff' : COL.text);
        text(ctx, '(E)', cx, cy + 22, 15, on ? '#ffffff' : COL.dim);
      } else if (b.label) text(ctx, b.label, cx, cy, 26, on ? '#ffffff' : COL.text);
      else drawArrowIcon(ctx, cx, cy, b.id, on ? '#ffffff' : COL.text);
    });
    ctx.restore();
  }

  // ---------------------------------------------------------------- landscape (title + escape sequence)
  function drawSky(ctx, y0, y1, sunY, cloudsFrom) {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, P.V); g.addColorStop(0.45, P.v); g.addColorStop(0.8, P.A); g.addColorStop(1, P.a);
    ctx.fillStyle = g; ctx.fillRect(0, y0, C.W, y1 - y0);
    const sg = ctx.createRadialGradient(360, sunY, 10, 360, sunY, 260);
    sg.addColorStop(0, 'rgba(255,220,150,0.55)'); sg.addColorStop(1, 'rgba(255,180,90,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, y0, C.W, y1 - y0);
    ctx.fillStyle = '#ffd98a';
    ctx.beginPath(); ctx.arc(360, sunY, 34, 0, Math.PI * 2); ctx.fill();
    // cloud bands
    [[60, sunY - 120, 220, 8], [380, sunY - 150, 260, 10], [200, sunY - 60, 300, 8], [480, sunY - 30, 180, 6]].forEach(([x, y, w, h]) => {
      if (cloudsFrom !== undefined && y < cloudsFrom) return;
      rect(ctx, x, y, w, h, 'rgba(120,70,110,0.5)');
      rect(ctx, x + 20, y - 4, w - 60, 4, 'rgba(160,90,120,0.4)');
    });
  }

  function drawHills(ctx, horizon) {
    ctx.fillStyle = '#2a1c3a';
    ctx.beginPath(); ctx.moveTo(0, horizon + 10);
    [[80, -50], [180, -20], [300, -70], [420, -30], [540, -90], [660, -40], [720, -60]].forEach(([x, dy]) => ctx.lineTo(x, horizon + dy));
    ctx.lineTo(C.W, horizon + 80); ctx.lineTo(0, horizon + 80); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1d1430';
    ctx.beginPath(); ctx.moveTo(0, horizon + 40);
    [[120, 10], [260, 30], [400, 0], [520, 30], [640, 10], [720, 30]].forEach(([x, dy]) => ctx.lineTo(x, horizon + dy));
    ctx.lineTo(C.W, horizon + 120); ctx.lineTo(0, horizon + 120); ctx.closePath(); ctx.fill();
    // river catching the last light
    ctx.fillStyle = 'rgba(242,166,90,0.35)';
    ctx.beginPath(); ctx.moveTo(300, horizon + 50); ctx.lineTo(340, horizon + 50); ctx.lineTo(520, horizon + 120); ctx.lineTo(420, horizon + 120); ctx.closePath(); ctx.fill();
  }

  function drawCastleSilhouette(ctx, x, base, t) {
    // keep, two towers, crenellations, lit windows
    const towers = [[x, base, 90, 300], [x + 130, base, 70, 240], [x + 260, base, 110, 380], [x + 400, base, 80, 260]];
    rect(ctx, x, base - 190, 480, 190, '#0d0a14');
    towers.forEach(([tx, ty, w, h]) => {
      rect(ctx, tx, ty - h, w, h, '#0d0a14');
      for (let i = 0; i < w; i += 20) rect(ctx, tx + i, ty - h - 14, 12, 14, '#0d0a14');
    });
    for (let i = 0; i < 480; i += 24) rect(ctx, x + i, base - 204, 14, 14, '#0d0a14');
    // windows
    ctx.fillStyle = `rgba(255,190,90,${0.6 + 0.3 * Math.sin(t * 2)})`;
    [[30, 120], [60, 200], [150, 100], [290, 260], [320, 180], [300, 90], [430, 160], [200, 60], [380, 60]].forEach(([dx, dy]) => rect(ctx, x + dx, base - dy, 8, 14, ctx.fillStyle));
    // banner on the tallest tower
    sprite(ctx, 'banner', x + 300, base - 400 - 44);
  }

  function drawTitle(ctx, game) {
    const t = game.clock, mem = game.mem;
    drawSky(ctx, 0, 700, 600, 500);
    drawHills(ctx, 640);
    drawCastleSilhouette(ctx, 250, 920, t);
    // foreground ground + the hero, large
    rect(ctx, 0, 920, C.W, C.H - 920, '#0d0a14');
    sprite(ctx, 'hero_idle', 70, 728, false, 8);

    shadowText(ctx, 'THE CASTLE', C.W / 2, 120, 64, COL.text);
    sprite(ctx, 'cross', C.W / 2 - 8, 158, false, 2);
    shadowText(ctx, 'REMEMBERS', C.W / 2, 220, 64, COL.gold);
    shadowText(ctx, spaced('CLIMB. LEARN. ADAPT. ESCAPE.'), C.W / 2, 290, 17, COL.gold);
    shadowText(ctx, 'Every action leaves a trace.', C.W / 2, 336, 21, COL.text, 'center', 'italic');
    shadowText(ctx, 'The castle remembers.', C.W / 2, 364, 21, COL.text, 'center', 'italic');
    shadowText(ctx, 'A forgotten castle in Visigothic Iberia, pre-711.', C.W / 2, 410, 16, COL.dim, 'center', 'normal');

    const status = mem.runs === 0
      ? 'It has never seen you.'
      : `It has watched you ${mem.runs} time${mem.runs === 1 ? '' : 's'}. Escapes: ${mem.completions}.`;
    shadowText(ctx, status, C.W / 2, 470, 20, `rgb(${COL.whisper})`, 'center', 'italic');

    const a = 0.55 + 0.45 * Math.sin(t * 3);
    stoneBar(ctx, 90, 1000, C.W - 180, 70);
    text(ctx, 'TAP OR PRESS ENTER', C.W / 2, 1035, 30, `rgba(232,192,100,${a})`);
    stoneBar(ctx, 60, 1085, C.W - 120, 50);
    text(ctx, '← → move · ↑ ↓ ladders · E interact · Space jump', C.W / 2, 1110, 17, COL.dim, 'center', 'normal');

    if (mem.runs > 0) {
      const F = C.FORGET;
      rrect(ctx, F.x, F.y, F.w, F.h, 12);
      ctx.fillStyle = 'rgba(26,19,32,0.9)'; ctx.fill();
      ctx.strokeStyle = '#4d4560'; ctx.lineWidth = 2; ctx.stroke();
      text(ctx, 'FORGET ME (F)', F.x + F.w / 2, F.y + F.h / 2, 20, COL.dim);
    }
    text(ctx, 'TOPIL CREATIONS', C.W / 2, 1252, 13, '#5f5870', 'center', 'normal');
    drawWhisper(ctx, game, 520);
  }

  // The escape: out through the final door onto the battlements at dusk.
  function drawEscape(ctx, game) {
    const t = game.endT, cl = game.clock;
    const horizon = 560;
    drawSky(ctx, 0, horizon + 40, horizon - 30);
    drawHills(ctx, horizon);
    // birds
    ctx.strokeStyle = 'rgba(20,10,30,0.8)'; ctx.lineWidth = 2;
    [[120, 200, 0.9], [170, 230, 1.1], [520, 160, 1.0], [560, 190, 0.8]].forEach(([bx, by, sp]) => {
      const x = (bx + t * 18 * sp) % (C.W + 40) - 20, y = by + Math.sin(t * 3 * sp + bx) * 6;
      ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x, y - 4); ctx.lineTo(x + 6, y); ctx.stroke();
    });
    // tower top: back merlons, walkway, front parapet (everything at 2× the in-game scale)
    const walk = 820;
    rect(ctx, 0, walk - 110, C.W, 110, P.X);
    for (let x = -20; x < C.W; x += 110) { rect(ctx, x, walk - 176, 70, 66, P.X); rect(ctx, x, walk - 176, 70, 5, P.x); rect(ctx, x + 66, walk - 176, 4, 66, '#1b1d26'); }
    rect(ctx, 0, walk - 110, C.W, 5, P.x);
    bricks(ctx, 0, walk, C.W, 44, 5);
    rect(ctx, 0, walk, C.W, 6, P.z);
    bricks(ctx, 0, walk + 44, C.W, C.H - walk - 44, 9);
    const g = ctx.createLinearGradient(0, walk + 60, 0, C.H);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.85)');
    ctx.fillStyle = g; ctx.fillRect(0, walk + 60, C.W, C.H - walk - 60);
    // the stair head the hero climbs out of
    rect(ctx, 150, walk - 70, 100, 70, '#0e0b12');
    sprite(ctx, 'arch', 140, walk - 110, false, 6);
    // banner pole
    rect(ctx, 580, walk - 330, 8, 330, P.D);
    const wave = Math.floor(cl * 6) % 2;
    sprite(ctx, 'banner', 588, walk - 326 + wave * 3, false, 4);
    drawTorch(ctx, 680, walk - 100, cl, 3, 4);

    // hero: climbs out (0–1.0s), walks to the edge (1.0–2.8s), stands with the cloak in the wind
    let frame, hx, hy;
    if (t < 1.0) { frame = Math.floor(t * 7) % 2 ? 'hero_climb1' : 'hero_climb2'; hx = 200; hy = walk + 70 - t * 70; }
    else if (t < 2.8) { const u = (t - 1.0) / 1.8; frame = ['hero_walk1', 'hero_idle', 'hero_walk2', 'hero_idle'][Math.floor(t * 9) % 4]; hx = 200 + u * 240; hy = walk; }
    else { frame = Math.floor(cl * 4) % 2 ? 'hero_wind1' : 'hero_wind2'; hx = 440; hy = walk; }
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, C.W, walk); ctx.clip();
    sprite(ctx, frame, hx - 32, hy - 96, false, 4);
    ctx.restore();
    if (game.winPhase === 'cine') {
      const a = clamp01((t - 2.2) / 0.8);
      shadowText(ctx, spaced('YOU ESCAPED'), C.W / 2, 90, 46, `rgba(232,192,100,${a})`);
      shadowText(ctx, 'The castle will remember how.', C.W / 2, 140, 20, `rgba(239,228,200,${a})`, 'center', 'italic');
      if (t > 0.5) text(ctx, 'tap to continue', C.W / 2, 1180, 16, 'rgba(154,143,156,0.6)', 'center', 'normal');
    }
  }

  function drawSummary(ctx, game, alpha) {
    const win = game.state === 'win', s = game.lastStats;
    ctx.save();
    ctx.globalAlpha = alpha;
    rect(ctx, 0, 0, C.W, C.H, 'rgba(6,4,10,0.86)');
    shadowText(ctx, win ? 'YOU ESCAPED' : 'YOU FELL', C.W / 2, 140, 54, win ? COL.gold : COL.danger);
    const sub = win
      ? `in ${s.time.toFixed(1)}s${game.mem.bestTime === Math.round(s.time * 1000) / 1000 ? '  — best yet' : ''}`
      : (s.cause || '');
    text(ctx, sub, C.W / 2, 200, 22, COL.text, 'center', 'normal');

    let y = 270;
    text(ctx, 'THIS RUN', 60, y, 22, COL.dim, 'left'); y += 42;
    const lines = [
      `Pace: ${game.lastPace === 'rush' ? 'RUSHED' : 'WAITED'} (${Math.round(game.lastIdleRatio * 100)}% standing still)`,
      `Doors taken: left ${s.doorL} · right ${s.doorR}`,
      `Levers pulled: ${s.leversPulled} (L ${s.leverL} · R ${s.leverR})`,
      `Guards shoved: ${s.confronted} · slipped past: ${s.avoided}`,
      `Chests opened: ${s.chests} of ${s.chestsAvail} · Traps sprung: ${s.traps}`,
      `Shards: ${s.shards} · Highest floor: ${s.maxFloor + 1}/${C.FLOORS}`
    ];
    lines.forEach(l => { text(ctx, l, 60, y, 20, COL.text, 'left', 'normal'); y += 34; });

    y += 30;
    text(ctx, spaced('THE CASTLE REMEMBERS'), 60, y, 20, `rgb(${COL.whisper})`, 'left'); y += 44;
    const notes = (game.nextPlan.notes || []).filter(n => n.line);
    if (!notes.length) y = wrap(ctx, '…nothing yet. Show it who you are.', 60, y, 600, 30, 20, `rgba(${COL.whisper},0.8)`);
    notes.slice(0, 7).forEach(n => { y = wrap(ctx, '• ' + n.line, 60, y, 600, 30, 20, `rgba(${COL.whisper},0.9)`) + 8; });

    const ready = win ? game.summaryT > 0.6 : game.endT > 0.6;
    if (ready) {
      const a = 0.55 + 0.45 * Math.sin(game.clock * 4);
      text(ctx, win ? 'TAP TO ENTER AGAIN' : 'TAP TO RISE AGAIN', C.W / 2, 1170, 30, `rgba(232,192,100,${a})`);
    }
    text(ctx, `Escapes ${game.mem.completions} · Falls ${game.mem.deaths}`, C.W / 2, 1225, 18, COL.dim, 'center', 'normal');
    ctx.restore();
  }

  // The reconstruction transition: OBSERVED → RECONSTRUCTING → the castle assembles floor by floor.
  function drawRebuild(ctx, game, input) {
    const t = game.rebuildT;
    if (t < REB.assembleAt) {
      rect(ctx, 0, 0, C.W, C.H, '#050308');
      const a1 = clamp01(t / 0.5);
      text(ctx, spaced('THE CASTLE OBSERVED YOU'), C.W / 2, 460, 22, `rgba(${COL.whisper},${a1})`);
      const a2 = clamp01((t - 0.45) / 0.5);
      if (a2 > 0) wrap(ctx, game.observation || '', C.W / 2, 530, 600, 36, 26, `rgba(239,228,200,${a2})`, 'center', 'bold');
      if (t >= REB.reconAt) {
        const dots = '.'.repeat(1 + (Math.floor((t - REB.reconAt) * 5) % 3));
        text(ctx, 'RECONSTRUCTING' + dots, C.W / 2, 740, 28, COL.gold, 'center');
      }
      if (t > REB.skipAfter) text(ctx, 'tap to hurry', C.W / 2, 1180, 16, 'rgba(154,143,156,0.6)', 'center', 'normal');
      return;
    }
    drawWorld(ctx, game, game.assembleT);
    const left = REB.total - t;
    const a = clamp01(left / 0.35);
    rect(ctx, 0, 0, C.W, 54, `rgba(8,6,12,${0.72 * a})`);
    const dots = '.'.repeat(1 + (Math.floor(t * 5) % 3));
    text(ctx, 'RECONSTRUCTING' + dots, C.W / 2, 28, 22, `rgba(232,192,100,${a})`);
    drawControls(ctx, input, true);
  }

  function drawDebugButton(ctx, on) {
    const B = C.DEBUG_BTN;
    rrect(ctx, B.x, B.y, B.w, B.h, 8);
    ctx.fillStyle = on ? 'rgba(159,227,165,0.25)' : 'rgba(8,6,12,0.6)';
    ctx.fill();
    ctx.strokeStyle = on ? COL.debug : '#4d4560';
    ctx.lineWidth = 2;
    ctx.stroke();
    text(ctx, 'DBG', B.x + B.w / 2, B.y + B.h / 2, 15, on ? COL.debug : COL.dim);
  }

  function drawDebug(ctx, game) {
    const lines = game.debugInfo();
    rect(ctx, 10, 96, C.W - 20, C.VIEW_H - 106, 'rgba(4,3,8,0.88)');
    ctx.strokeStyle = COL.debug; ctx.lineWidth = 1;
    ctx.strokeRect(10.5, 96.5, C.W - 21, C.VIEW_H - 107);
    let y = 116;
    text(ctx, 'BEHAVIOR MODEL  (` or I, or tap DBG)', 22, y, 14, COL.debug, 'left'); y += 26;
    for (const l of lines) {
      if (y > C.VIEW_H - 24) break;
      if (l === '') { y += 10; continue; }
      const head = /^(STORED|THIS CASTLE|NEXT CASTLE|THIS RUN)/.test(l);
      y = wrap(ctx, l, 22, y, C.W - 44, 19, 14, head ? COL.debug : COL.text, 'left', head ? 'bold' : 'normal') + 3;
    }
  }

  function render(ctx, game, input) {
    ctx.save();
    rect(ctx, 0, 0, C.W, C.H, COL.bg);
    if (game.state === 'title') {
      drawTitle(ctx, game);
    } else if (game.state === 'rebuild') {
      drawRebuild(ctx, game, input);
    } else if (game.state === 'win') {
      drawEscape(ctx, game);
      if (game.winPhase === 'summary') drawSummary(ctx, game, clamp01(game.summaryT / 0.5));
    } else {
      drawWorld(ctx, game, null);
      if (game.flash > 0) rect(ctx, 0, 0, C.W, C.VIEW_H, `rgba(214,40,32,${(0.45 * game.flash).toFixed(3)})`);
      drawHUD(ctx, game);
      drawWhisper(ctx, game, 92);
      drawControls(ctx, input, false);
      if (game.state === 'dead') drawSummary(ctx, game, clamp01(game.endT / 0.5));
    }
    if (game.debug) drawDebug(ctx, game);
    drawDebugButton(ctx, game.debug);
    ctx.restore();
  }

  CR.render = render;
  CR.renderParts = { drawWorld, drawEscape, drawTitle };
})(window.CR = window.CR || {});


// THE CASTLE REMEMBERS — boot + loop
(function (CR) {
  'use strict';
  const C = CR.C;

  function safeStorage() {
    try {
      const ls = window.localStorage;
      ls.setItem('__cr_test', '1');
      ls.removeItem('__cr_test');
      return ls;
    } catch (e) {
      return CR.Memory.memoryStorage(); // private mode etc. — play still works, just won't persist
    }
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = C.W;
  canvas.height = C.H;

  function fit() {
    const s = Math.min(window.innerWidth / C.W, window.innerHeight / C.H);
    canvas.style.width = Math.floor(C.W * s) + 'px';
    canvas.style.height = Math.floor(C.H * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  const game = new CR.Game(safeStorage());
  const input = new CR.Input(canvas);
  window.CASTLE = game; // handy for debugging in the console

  // Audio context requires user gesture to resume on some browsers
  const unlockAudio = () => {
    if (CR.Sound && CR.Sound.context && CR.Sound.context.state === 'suspended') {
      CR.Sound.context.resume().catch(() => {});
    }
    window.removeEventListener('pointerdown', unlockAudio);
    window.removeEventListener('touchstart', unlockAudio);
    window.removeEventListener('keydown', unlockAudio);
  };
  window.addEventListener('pointerdown', unlockAudio);
  window.addEventListener('touchstart', unlockAudio);
  window.addEventListener('keydown', unlockAudio);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    try {
      game.update(dt, input.sample());
      CR.render(ctx, game, input);
    } catch (err) {
      console.error(err);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})(window.CR);

</script>
